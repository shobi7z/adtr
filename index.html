<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة إدارة تتبع الطلبات</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <style>
        .status-badge {
            transition: all 0.3s ease;
        }
        .progress-bar {
            background: linear-gradient(90deg, #10b981 0%, #059669 100%);
        }
        .card-shadow {
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen font-sans">
    <div class="container mx-auto px-4 py-8">
        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold text-gray-800 mb-2">🚚 لوحة إدارة تتبع الطلبات</h1>
            <p class="text-gray-600">إدارة وتتبع حالة الطلبات بسهولة</p>
        </div>

        <!-- Add New Order Section -->
        <div class="bg-white rounded-xl p-6 mb-8 card-shadow">
            <h2 class="text-2xl font-bold text-gray-800 mb-4 flex items-center">
                ➕ إضافة طلب جديد
            </h2>
            <div class="flex gap-4 items-end">
                <div class="flex-1">
                    <label class="block text-sm font-medium text-gray-700 mb-2">رقم التتبع</label>
                    <input type="text" id="trackingNumber" 
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                           placeholder="أدخل رقم التتبع...">
                </div>
                <button onclick="addOrder()" 
                        class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg font-medium transition-colors">
                    إضافة الطلب
                </button>
            </div>
        </div>

        <!-- Orders List -->
        <div class="bg-white rounded-xl p-6 card-shadow">
            <h2 class="text-2xl font-bold text-gray-800 mb-6 flex items-center">
                📦 قائمة الطلبات
            </h2>
            <div id="ordersList" class="space-y-4">
                <!-- Orders will be loaded here -->
            </div>
        </div>
    </div>

    <!-- Status Update Modal -->
    <div id="statusModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-xl p-6 max-w-md w-full mx-4">
            <h3 class="text-xl font-bold text-gray-800 mb-4">تحديث حالة الطلب</h3>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-2">الحالة الجديدة</label>
                <select id="newStatus" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                    <option value="0">تم الشراء</option>
                    <option value="1">جاري تجهيز الطلب</option>
                    <option value="2">تم الشحن</option>
                    <option value="3">تم الاستلام في الكويت</option>
                    <option value="4">تم الشحن للعراق</option>
                    <option value="5">تم التسليم</option>
                </select>
            </div>
            <div class="flex gap-3">
                <button onclick="updateOrderStatus()" 
                        class="flex-1 bg-green-600 hover:bg-green-700 text-white py-2 rounded-lg font-medium transition-colors">
                    تحديث
                </button>
                <button onclick="closeModal()" 
                        class="flex-1 bg-gray-500 hover:bg-gray-600 text-white py-2 rounded-lg font-medium transition-colors">
                    إلغاء
                </button>
            </div>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="deleteModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-xl p-6 max-w-md w-full mx-4 transform transition-all">
            <div class="text-center mb-6">
                <div class="mx-auto flex items-center justify-center h-16 w-16 rounded-full bg-red-100 mb-4">
                    <svg class="h-8 w-8 text-red-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                    </svg>
                </div>
                <h3 class="text-xl font-bold text-gray-800 mb-2">تأكيد حذف الطلب</h3>
                <p class="text-gray-600 mb-2">هل أنت متأكد من حذف هذا الطلب؟</p>
                <div class="bg-red-50 border border-red-200 rounded-lg p-3 mb-4">
                    <p class="text-sm text-red-700">
                        <span class="font-medium">رقم التتبع:</span> 
                        <span id="deleteTrackingNumber" class="font-bold"></span>
                    </p>
                </div>
                <p class="text-sm text-red-600 font-medium">⚠️ هذا الإجراء لا يمكن التراجع عنه</p>
            </div>
            
            <div class="flex gap-3">
                <button onclick="confirmDelete()" 
                        class="flex-1 bg-red-600 hover:bg-red-700 text-white py-3 rounded-lg font-medium transition-colors flex items-center justify-center gap-2">
                    <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                    </svg>
                    نعم، احذف الطلب
                </button>
                <button onclick="closeDeleteModal()" 
                        class="flex-1 bg-gray-500 hover:bg-gray-600 text-white py-3 rounded-lg font-medium transition-colors">
                    إلغاء
                </button>
            </div>
        </div>
    </div>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDEP35xsyNnDFNY4XEjm9ipvTBk44SKQ1Y",
            authDomain: "qq-9acb9.firebaseapp.com",
            databaseURL: "https://qq-9acb9-default-rtdb.firebaseio.com",
            projectId: "qq-9acb9",
            storageBucket: "qq-9acb9.appspot.com",
            messagingSenderId: "541616407142",
            appId: "1:541616407142:web:95d8b7773b371b05e7a3a7"
        };
        
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // Order statuses
        const statuses = [
            { name: "تم الشراء", color: "bg-blue-500", icon: "🛒" },
            { name: "جاري تجهيز الطلب", color: "bg-yellow-500", icon: "📦" },
            { name: "تم الشحن", color: "bg-purple-500", icon: "🚛" },
            { name: "تم الاستلام في الكويت", color: "bg-orange-500", icon: "🏢" },
            { name: "تم الشحن للعراق", color: "bg-indigo-500", icon: "✈️" },
            { name: "تم التسليم", color: "bg-green-500", icon: "✅" }
        ];

        let currentOrderId = null;
        let orderToDelete = null;

        // Add new order
        function addOrder() {
            const trackingNumber = document.getElementById('trackingNumber').value.trim();
            
            if (!trackingNumber) {
                alert('يرجى إدخال رقم التتبع');
                return;
            }

            const orderData = {
                trackingNumber: trackingNumber,
                status: 0,
                createdAt: Date.now(),
                lastUpdated: Date.now()
            };

            database.ref('orders').push(orderData)
                .then(() => {
                    document.getElementById('trackingNumber').value = '';
                    alert('تم إضافة الطلب بنجاح!');
                    loadOrders();
                })
                .catch((error) => {
                    alert('حدث خطأ في إضافة الطلب: ' + error.message);
                });
        }

        // Load orders from Firebase
        function loadOrders() {
            database.ref('orders').on('value', (snapshot) => {
                const orders = snapshot.val();
                const ordersList = document.getElementById('ordersList');
                
                if (!orders) {
                    ordersList.innerHTML = '<p class="text-gray-500 text-center py-8">لا توجد طلبات حالياً</p>';
                    return;
                }

                let ordersHTML = '';
                Object.keys(orders).forEach(orderId => {
                    const order = orders[orderId];
                    const status = statuses[order.status];
                    const progress = ((order.status + 1) / statuses.length) * 100;
                    
                    ordersHTML += `
                        <div class="border border-gray-200 rounded-lg p-4 hover:shadow-md transition-shadow">
                            <div class="flex justify-between items-start mb-3">
                                <div>
                                    <h3 class="font-bold text-lg text-gray-800">رقم التتبع: ${order.trackingNumber}</h3>
                                    <p class="text-sm text-gray-500">تاريخ الإضافة: ${new Date(order.createdAt).toLocaleDateString('ar-EG')}</p>
                                </div>
                                <div class="flex gap-2">
                                    <button onclick="openStatusModal('${orderId}')" 
                                            class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-1 rounded-lg text-sm transition-colors">
                                        تعديل الحالة
                                    </button>
                                    <button onclick="deleteOrder('${orderId}', '${order.trackingNumber}')" 
                                            class="bg-red-100 hover:bg-red-200 text-red-700 px-3 py-1 rounded-lg text-sm transition-colors">
                                        🗑️ حذف
                                    </button>
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <div class="flex items-center justify-between mb-2">
                                    <span class="text-sm font-medium text-gray-700">حالة الطلب:</span>
                                    <span class="status-badge ${status.color} text-white px-3 py-1 rounded-full text-sm font-medium">
                                        ${status.icon} ${status.name}
                                    </span>
                                </div>
                                <div class="w-full bg-gray-200 rounded-full h-2">
                                    <div class="progress-bar h-2 rounded-full transition-all duration-500" style="width: ${progress}%"></div>
                                </div>
                            </div>
                            
                            <div class="grid grid-cols-2 md:grid-cols-6 gap-2 text-xs">
                                ${statuses.map((s, index) => `
                                    <div class="text-center p-2 rounded ${index <= order.status ? s.color + ' text-white' : 'bg-gray-100 text-gray-500'}">
                                        <div class="text-lg mb-1">${s.icon}</div>
                                        <div class="font-medium">${s.name}</div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                });
                
                ordersList.innerHTML = ordersHTML;
            });
        }

        // Open status update modal
        function openStatusModal(orderId) {
            currentOrderId = orderId;
            document.getElementById('statusModal').classList.remove('hidden');
            document.getElementById('statusModal').classList.add('flex');
        }

        // Close modal
        function closeModal() {
            document.getElementById('statusModal').classList.add('hidden');
            document.getElementById('statusModal').classList.remove('flex');
            currentOrderId = null;
        }

        // Update order status manually
        function updateOrderStatus() {
            if (!currentOrderId) return;
            
            const newStatus = parseInt(document.getElementById('newStatus').value);
            
            database.ref(`orders/${currentOrderId}`).update({
                status: newStatus,
                lastUpdated: Date.now()
            })
            .then(() => {
                alert('تم تحديث حالة الطلب بنجاح!');
                closeModal();
            })
            .catch((error) => {
                alert('حدث خطأ في تحديث الحالة: ' + error.message);
            });
        }

        // Delete order function
        function deleteOrder(orderId, trackingNumber) {
            orderToDelete = { id: orderId, trackingNumber: trackingNumber };
            document.getElementById('deleteTrackingNumber').textContent = trackingNumber;
            document.getElementById('deleteModal').classList.remove('hidden');
            document.getElementById('deleteModal').classList.add('flex');
        }

        // Close delete modal
        function closeDeleteModal() {
            document.getElementById('deleteModal').classList.add('hidden');
            document.getElementById('deleteModal').classList.remove('flex');
            orderToDelete = null;
        }

        // Confirm delete
        function confirmDelete() {
            if (!orderToDelete) return;
            
            database.ref(`orders/${orderToDelete.id}`).remove()
                .then(() => {
                    alert('تم حذف الطلب بنجاح! ✅');
                    closeDeleteModal();
                })
                .catch((error) => {
                    alert('حدث خطأ في حذف الطلب: ' + error.message);
                });
        }

        // Auto-update order statuses every 3 days
        function checkAndUpdateStatuses() {
            database.ref('orders').once('value', (snapshot) => {
                const orders = snapshot.val();
                if (!orders) return;

                const now = Date.now();
                const threeDays = 3 * 24 * 60 * 60 * 1000; // 3 days in milliseconds

                Object.keys(orders).forEach(orderId => {
                    const order = orders[orderId];
                    const timeSinceLastUpdate = now - order.lastUpdated;
                    
                    // Auto-update if 3 days have passed and not at final status
                    if (timeSinceLastUpdate >= threeDays && order.status < 4) {
                        const newStatus = order.status + 1;
                        database.ref(`orders/${orderId}`).update({
                            status: newStatus,
                            lastUpdated: now
                        });
                    }
                    
                    // Special case: Move from status 4 to 5 immediately
                    if (order.status === 4 && timeSinceLastUpdate >= 1000) { // 1 second delay for immediate update
                        database.ref(`orders/${orderId}`).update({
                            status: 5,
                            lastUpdated: now
                        });
                    }
                });
            });
        }

        // Initialize the application
        document.addEventListener('DOMContentLoaded', function() {
            loadOrders();
            
            // Check for status updates every hour
            setInterval(checkAndUpdateStatuses, 60 * 60 * 1000);
            
            // Initial check
            checkAndUpdateStatuses();
        });

        // Handle Enter key in tracking number input
        document.getElementById('trackingNumber').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                addOrder();
            }
        });
    </script>

</html>
